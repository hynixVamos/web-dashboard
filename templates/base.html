<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI 인프라 트래킹{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <h1>AI 인프라 트래킹</h1>
    <p class="subtitle">GPU 렌탈가 &middot; 주가수익률 &middot; 하이퍼스케일러 Capex &middot; SK하이닉스 ADR</p>
  </div>
  <div class="topbar-right">
    <span class="live-dot" title="30분마다 자동 갱신"></span>
    <span class="update-text">업데이트 <span class="mono">{{ last_updated }}</span></span>
  </div>
</header>

<nav class="tabnav">
  <a href="{{ url_for('overview') }}" class="tab {{ 'active' if active_tab=='overview' else '' }}">개요</a>
  <a href="{{ url_for('gpu_page') }}" class="tab {{ 'active' if active_tab=='gpu' else '' }}">GPU 렌탈가</a>
  <a href="{{ url_for('stocks_page') }}" class="tab {{ 'active' if active_tab=='stocks' else '' }}">주가수익률</a>
  <a href="{{ url_for('hyperscaler_page') }}" class="tab {{ 'active' if active_tab=='hyperscaler' else '' }}">하이퍼스케일러</a>
  <a href="{{ url_for('adr_page') }}" class="tab {{ 'active' if active_tab=='adr' else '' }}">ADR</a>
</nav>

{% if last_error %}
<div class="error-banner">일부 소스 오류: {{ last_error }}</div>
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <span>개인 리서치용 &middot; 자동 갱신 30분 주기 &middot; <a href="/api/gpu">GPU JSON</a> &middot; <a href="/api/stocks">주가 JSON</a> &middot; <a href="/api/hyperscaler">Capex JSON</a> &middot; <a href="/api/adr">ADR JSON</a></span>
</footer>

</body>
</html>
